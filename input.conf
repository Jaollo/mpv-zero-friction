# ==========================================================
# mpv.net Zero-Friction Workstation v0.9.1
# ==========================================================

# --- 1. FRAME STEPPING (Arrows + Side Buttons) ---
LEFT         frame-back-step
RIGHT        frame-step
MBTN_BACK    script-binding mouse-back-repeat
MBTN_FORWARD script-binding mouse-forward-repeat
MBTN_Back    script-binding mouse-back-repeat
MBTN_Forward script-binding mouse-forward-repeat
MOUSE_BTN7   script-binding mouse-back-repeat
MOUSE_BTN8   script-binding mouse-forward-repeat
MOUSE_BTN5   script-binding mouse-back-repeat
MOUSE_BTN6   script-binding mouse-forward-repeat
GO_BACK      script-binding mouse-back-repeat
GO_FORWARD   script-binding mouse-forward-repeat
XF86_BACK    script-binding mouse-back-repeat
XF86_FORWARD script-binding mouse-forward-repeat
Prev         script-binding mouse-back-repeat
Next         script-binding mouse-forward-repeat
Alt+LEFT     script-binding mouse-back-repeat
Alt+RIGHT    script-binding mouse-forward-repeat

# --- 2. SPEED (Up/Down Arrows) ---
DOWN       add speed -0.05
UP         add speed  0.05

# --- 3. SEEKING (Comma/Period) ---
,          seek -2 exact
.          seek  2 exact

# --- 4. VOLUME (Scroll Wheel) ---
WHEEL_UP             add volume  2
WHEEL_DOWN           add volume -2

# --- 5. ZOOMING (Ctrl + Scroll Wheel & Reset) ---
Ctrl+WHEEL_UP    script-binding zoom-in-cursor
Ctrl+WHEEL_DOWN  script-binding zoom-out-cursor
Ctrl+Wheel_Up    script-binding zoom-in-cursor
Ctrl+Wheel_Down  script-binding zoom-out-cursor
Ctrl+0           script-binding zoom-reset
Ctrl+BS          script-binding zoom-reset
Ctrl+MBTN_MID    script-binding zoom-reset

# --- 6. WINDOW DRAG (Mouse1) ---
# Handled natively by window-dragging=yes in mpv.conf

# --- 7. PAUSE / MUTE / QUIT (Mouse Buttons) ---
MBTN_RIGHT     quit
MBTN_MID       script-binding double-right-quit
RCTRL          cycle pause
-              cycle pause
p              no-osd cycle mute

# --- 8. LOOPING ---
m          ab-loop
M          cycle loop-file

# --- 9. UTILITIES ---
'          vf toggle lavfi=[crop=ih*(9/16):ih]
ESC        quit
